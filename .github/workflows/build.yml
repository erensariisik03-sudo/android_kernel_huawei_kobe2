name: Build Huawei KOB2 Kernel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android 11 Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex xz-utils \
            libssl-dev libelf-dev libexpat1-dev \
            libffi-dev zlib1g-dev libbz2-dev \
            libreadline-dev libsqlite3-dev \
            device-tree-compiler curl ca-certificates \
            perl rsync

      - name: Install Android GCC 4.9 toolchain
        shell: bash
        run: |
          set -euo pipefail

          # Eski 4.14 çekirdekler Android'in GCC 4.9 araç zinciriyle derlenir.
          # Modern GCC 11'in çıkardığı uyarı/hata sorunlarını baştan önler.
          for i in 1 2 3; do
            rm -rf "$HOME/gcc49"
            if git clone --depth=1 -b lineage-19.1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
              "$HOME/gcc49"; then
              break
            fi
            echo "Clone başarısız, tekrar deneniyor ($i/3)..."
            sleep 5
          done

          CROSS="$HOME/gcc49/bin/aarch64-linux-android-"
          echo "CROSS=$CROSS" >> "$GITHUB_ENV"

          "${CROSS}gcc" --version | head -n 1

      - name: Build Python 2.7
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"

          curl -fL --retry 3 \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz \
            -o Python-2.7.18.tgz

          tar -xzf Python-2.7.18.tgz
          cd Python-2.7.18

          CFLAGS="-O2 -fno-strict-aliasing -Wno-implicit-function-declaration" \
            ./configure \
              --prefix="$RUNNER_TEMP/python2" \
              --disable-shared \
              --without-ensurepip

          make -j2
          make install

          mkdir -p "$RUNNER_TEMP/python2-bin"
          ln -sf "$RUNNER_TEMP/python2/bin/python2.7" \
            "$RUNNER_TEMP/python2-bin/python2"

          echo "$RUNNER_TEMP/python2-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python2-bin/python2" --version

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          make O=out ARCH=arm64 \
            CROSS_COMPILE="$CROSS" \
            kobe2_defconfig

          test -s out/.config

          echo "=== Wi-Fi / connectivity configuration ==="
          grep -E \
            'CONFIG_(MTK_COMBO|WLAN|MTK_CONN|MTK_WIFI)[A-Z0-9_]*=' \
            out/.config || true

          echo "=== HIF (bus) selection in connectivity Makefile ==="
          grep -rn 'MTK_COMBO_WIFI_HIF' \
            drivers/misc/mediatek/connectivity/Makefile || true

          echo "=== Sniffer source support ==="
          grep -n 'CFG_SUPPORT_SNIFFER' \
            drivers/misc/mediatek/connectivity/wlan_drv_gen4m/include/config.h

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/python2-bin:$PATH"

          python2 --version
          "${CROSS}gcc" --version | head -n 1

          # -k: ilk hatada durma, tüm hataları tek çalıştırmada topla
          make -k -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE="$CROSS" \
            Image.gz-dtb 2>&1 | tee build.log

          test -s out/arch/arm64/boot/Image.gz-dtb
          echo "Kernel image created successfully."
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Show first errors
        if: failure()
        shell: bash
        run: |
          echo "=== Hata satırları (ilk 60) ==="
          grep -nE 'error:|\*\*\* \[|Error [0-9]+' build.log | head -60 || true

      - name: Show build outputs
        if: always()
        shell: bash
        run: |
          if [ -d out/arch/arm64/boot ]; then
            find out/arch/arm64/boot -type f \
              \( -name '*.dtb' -o -name '*.dtbo' -o -name 'Image*' \) \
              -printf '%p (%s bytes)\n' | sort || true
          fi

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KOB2-Kernel-Build
          path: |
            out/arch/arm64/boot/
            out/.config
            out/System.map
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KOB2-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
